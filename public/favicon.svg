<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle for better visibility -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" opacity="0.2"/>
  <!-- WiFi waves with increased thickness -->
  <path d="M20 70 Q50 45 80 70" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M25 75 Q50 55 75 75" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M30 80 Q50 65 70 80" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Center dot -->
  <circle cx="50" cy="85" r="4" fill="url(#grad)"/>
  <!-- Speed lines with increased thickness -->
  <path d="M15 40 L35 40" stroke="url(#grad)" stroke-width="3"/>
  <path d="M65 40 L85 40" stroke="url(#grad)" stroke-width="3"/>
  <path d="M40 15 L40 35" stroke="url(#grad)" stroke-width="3"/>
  <path d="M40 65 L40 85" stroke="url(#grad)" stroke-width="3"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>

