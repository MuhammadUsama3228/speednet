<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="15" ry="15" fill="url(#bgGrad)"/>
  
  <!-- Background arc -->
  <path d="M 22 58 A 28 28 0 0 1 78 58" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="5" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Colored speed arc -->
  <path d="M 22 58 A 28 28 0 0 1 65 35" 
        stroke="url(#arcGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Needle -->
  <g transform="translate(50, 55) rotate(-50)">
    <polygon points="0,-1.5 24,0 0,1.5" fill="white"/>
    <circle cx="0" cy="0" r="4" fill="white"/>
  </g>
  
  <!-- Signal waves -->
  <path d="M 42 32 A 8 8 0 0 1 58 32" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 38 28 A 12 12 0 0 1 62 28" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 34 24 A 16 16 0 0 1 66 24" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- S text -->
  <text x="50" y="82" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">S</text>
</svg>
