<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Logo on left side -->
  <g transform="translate(250, 315)">
    <!-- Background arc -->
    <path d="M -100 20 A 110 110 0 0 1 100 20" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="18" 
          stroke-linecap="round" 
          fill="none"/>
    
    <!-- Colored speed arc -->
    <path d="M -100 20 A 110 110 0 0 1 50 -80" 
          stroke="url(#arcGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          fill="none"/>
    
    <!-- Needle -->
    <g transform="rotate(-50)">
      <polygon points="0,-5 90,0 0,5" fill="white"/>
      <circle cx="0" cy="0" r="14" fill="white"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="500" y="290" fill="white" font-size="120" font-weight="bold" font-family="Arial, sans-serif">SpeedNet</text>
  <text x="500" y="380" fill="rgba(255,255,255,0.8)" font-size="48" font-family="Arial, sans-serif">Accurate Internet Speed Test</text>
</svg>
