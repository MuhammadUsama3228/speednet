<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo Icon Left -->
  <g transform="translate(300, 315)">
    <!-- Radar Circles -->
    <circle cx="0" cy="0" r="180" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.2"/>
    <circle cx="0" cy="0" r="120" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.4"/>
    
    <!-- Ping Pulse -->
    <circle cx="0" cy="0" r="30" fill="#10b981" filter="url(#glow)"/>
    
    <!-- WiFi Waves -->
    <path d="M -60 -60 A 85 85 0 0 1 60 -60" stroke="#a855f7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M -100 -100 A 140 140 0 0 1 100 -100" stroke="#8b5cf6" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Text Content Right -->
  <g transform="translate(550, 250)">
    <text x="0" y="60" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="120">ScanPing</text>
    <text x="0" y="140" fill="#94a3b8" font-family="Arial, sans-serif" font-size="40">The Advanced Network Diagnostic Tool</text>
    
    <!-- Tagline pills -->
    <g transform="translate(0, 200)">
        <rect x="0" y="0" width="160" height="50" rx="25" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2"/>
        <text x="80" y="32" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-weight="bold" font-size="20">PING</text>
        
        <rect x="180" y="0" width="160" height="50" rx="25" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2"/>
        <text x="260" y="32" text-anchor="middle" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="bold" font-size="20">DOWNLOAD</text>
        
        <rect x="360" y="0" width="160" height="50" rx="25" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="2"/>
        <text x="440" y="32" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-weight="bold" font-size="20">UPLOAD</text>
    </g>
  </g>
</svg>
