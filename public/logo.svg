<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="scanGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect x="0" y="0" width="1000" height="1000" rx="200" ry="200" fill="url(#bgGrad)"/>
  
  <!-- Content Container -->
  <g transform="translate(500, 500)">
    
    <!-- Radar Grid Circles -->
    <circle cx="0" cy="0" r="350" stroke="rgba(56, 189, 248, 0.2)" stroke-width="10" fill="none"/>
    <circle cx="0" cy="0" r="250" stroke="rgba(56, 189, 248, 0.2)" stroke-width="10" fill="none"/>
    <circle cx="0" cy="0" r="150" stroke="rgba(56, 189, 248, 0.3)" stroke-width="10" fill="none"/>
    
    <!-- Crosshairs -->
    <line x1="-380" y1="0" x2="380" y2="0" stroke="rgba(56, 189, 248, 0.2)" stroke-width="6"/>
    <line x1="0" y1="-380" x2="0" y2="380" stroke="rgba(56, 189, 248, 0.2)" stroke-width="6"/>

    <!-- Pulse/Ping Rings (Center) -->
    <circle cx="0" cy="0" r="40" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="40;60;40" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Scanning Sector (Rotating) -->
    <path d="M 0 0 L 350 -50 A 350 350 0 0 1 350 50 Z" fill="url(#scanGrad)" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- WiFi Waves (Top Right Quadrant) -->
    <g transform="translate(100, -100) rotate(-45)">
      <path d="M -60 -60 A 85 85 0 0 1 60 -60" stroke="#a855f7" stroke-width="25" stroke-linecap="round" fill="none"/>
      <path d="M -100 -100 A 140 140 0 0 1 100 -100" stroke="#8b5cf6" stroke-width="25" stroke-linecap="round" fill="none"/>
      <path d="M -140 -140 A 195 195 0 0 1 140 -140" stroke="#6366f1" stroke-width="25" stroke-linecap="round" fill="none"/>
    </g>

    <!-- SP Text Impact -->
    <text x="0" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="100" opacity="0.8" letter-spacing="10">SCANPING</text>
  </g>
</svg>
